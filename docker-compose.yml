# Full local stack: guard + dashboard, Postgres, Redis, Prometheus and Grafana.
#   docker compose up --build
#   dashboard  http://localhost:8080
#   API docs   http://localhost:8080/docs
#   Grafana    http://localhost:3000  (anonymous viewer, dashboard "AgentPay Guard")
services:
  guard:
    build: .
    ports: ['8080:8080']
    environment:
      DATABASE_URL: postgres://agentpay:agentpay@postgres:5432/agentpay
      REDIS_URL: redis://redis:6379
      DEMO_MODE: '${DEMO_MODE:-true}'
      ADMIN_TOKEN: '${ADMIN_TOKEN:-local-dev-admin-token}'
      LLM_CLASSIFIER: '${LLM_CLASSIFIER:-false}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentpay
      POSTGRES_PASSWORD: agentpay
      POSTGRES_DB: agentpay
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentpay']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ['9090:9090']
    depends_on: [guard]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentpay.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
    depends_on: [prometheus]

volumes:
  pgdata:

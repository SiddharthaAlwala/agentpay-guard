name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentpay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentpay_test
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_DATABASE_URL_PROXY: postgres://postgres:postgres@localhost:5432/spendguard_test
      TEST_REDIS_URL_PROXY: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the proxy's test database
        run: psql postgres://postgres:postgres@localhost:5432/postgres -c 'CREATE DATABASE spendguard_test'
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck all packages
        run: npm run typecheck
      - name: Unit + integration tests (real Postgres and Redis)
        run: npm test
      - name: Build everything
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentpay-guard:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image against Postgres and Redis
        run: |
          docker network create apg
          docker run -d --name pg --network apg -e POSTGRES_PASSWORD=pg postgres:16-alpine
          docker run -d --name redis --network apg redis:7-alpine
          sleep 8
          docker run -d --name guard --network apg -p 8080:8080 \
            -e DATABASE_URL=postgres://postgres:pg@pg:5432/postgres \
            -e REDIS_URL=redis://redis:6379 -e DEMO_MODE=true agentpay-guard:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8080/v1/demo/scenarios/prompt_injection | grep -q '"status":"blocked"'
          curl -sf localhost:8080/v1/admin/ledger/integrity | grep -q '"balanced":true'
          curl -sf localhost:8080/ | grep -q 'AgentPay Guard'
          docker logs guard | tail -20
      - name: Build the Spend Guard proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: proxy
          push: false
          tags: spendguard-proxy:ci
          load: true
          cache-from: type=gha
      - name: Smoke test the proxy image
        run: |
          docker run -d --name proxy --network apg -p 8090:8090 \
            -e DATABASE_URL=postgres://postgres:pg@pg:5432/postgres -e REDIS_URL=redis://redis:6379 \
            -e NODE_ENV=production -e ENCRYPTION_KEYS="ci:$(openssl rand -base64 32)" spendguard-proxy:ci
          for i in $(seq 1 30); do curl -sf localhost:8090/readyz && break; sleep 1; done
          curl -sf localhost:8090/readyz | grep -q '"postgres":"ok"'
          # An unknown key must be refused in Anthropic's own error format.
          curl -s -X POST localhost:8090/anthropic/v1/messages -H 'x-api-key: apg_live_00000000000000000000000000000000' \
            -H 'content-type: application/json' -d '{}' | grep -q authentication_error
          docker logs proxy | tail -20
